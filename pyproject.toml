[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plyslicer"
version = "0.1.0"
description = "Assembly-aware curved laminations for thin STL and 3MF models"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "trimesh>=4.6,<5", "manifold3d>=3,<4", "shapely>=2,<3", "rtree>=1.3,<2", "networkx>=3,<4", "lxml>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
plyslicer = "plyslicer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
